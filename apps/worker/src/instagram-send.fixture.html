<!doctype html>
<meta charset="utf-8" />
<nav><a href="/direct/inbox/">Inbox</a></nav>
<main>
  <header>
    <h2>fixture_company</h2>
    <button>Повідомлення</button>
  </header>
</main>
<script>
  const f = window.fixtureOptions || {};
  const selfLink = (handle) =>
    `<a href="/${handle}/" role="link" tabindex="0"><span role="link" tabindex="-1"><img width="24" height="24" alt="${handle}'s profile picture"></span></a>`;
  if (f.observedMessage) {
    const rail = document.createElement('div');
    rail.id = 'fixture-rail';
    rail.innerHTML =
      '<a href="/">Home</a><a href="/reels/">Reels</a><a href="/direct/inbox/">Messages</a><a href="/explore/">Search</a>';
    if (f.malformedLink)
      rail.insertAdjacentHTML(
        'beforeend',
        '<a href="http://[">Invalid link</a>',
      );
    const self = document.createElement('div');
    self.innerHTML = selfLink('fixture_sender');
    if (f.senderPictureMismatch)
      self.querySelector('img').alt = "another_sender's profile picture";
    if (!f.senderMissing) rail.append(self);
    if (f.ambiguousSender)
      rail.insertAdjacentHTML('beforeend', selfLink('another_sender'));
    document.body.prepend(rail);
    if (f.senderOutsideRail) document.body.prepend(self);
  }
  let main = document.querySelector('main');
  if (f.outerDialog || f.outerMain) {
    const outer = document.createElement('div');
    outer.setAttribute('role', f.outerDialog ? 'dialog' : 'main');
    main.replaceWith(outer);
    outer.append(main);
  }
  if (f.checkpoint) history.replaceState({}, '', '/challenge/');
  if (f.noSession) document.querySelector('nav').remove();
  if (f.wrongProfile) main.querySelector('h2').textContent = 'other';
  if (f.messageLink)
    main.querySelector('button').outerHTML =
      '<a href="#" role="link">Message</a>';
  if (f.login) main.innerHTML = '<input type="password">';
  else if (f.captcha)
    main.innerHTML = '<div data-testid="captcha">Captcha</div>';
  else if (f.noMessage) main.querySelector('button').remove();
  else if (f.domRateLimit)
    main.innerHTML = '<div role="alert">Try again later</div>';
  else {
    const openConversation = (event) => {
      event.preventDefault();
      window.fixtureEvent('open');
      if (f.noDialog) return;
      const open = () => {
        history.pushState({}, '', '/direct/t/fixture-thread/');
        const lexical = `<div class="notranslate" contenteditable="${f.noneditableComposer ? 'false' : 'true'}" role="${f.nonTextboxComposer ? 'searchbox' : 'textbox'}" spellcheck="false" tabindex="0" aria-placeholder="${f.lexicalPlaceholder ?? 'Message...'}" ${f.readonlyComposer ? 'aria-readonly="true"' : ''} style="user-select: text; white-space: pre-wrap; word-break: break-word;" data-lexical-editor="true" data-interactable="|click||input||keydown|"><p dir="auto"><br></p></div>`;
        main.innerHTML = `<header><a href="/${f.wrongRecipient ? 'other' : 'fixture_company'}/">Recipient</a></header>
      <section id="messages"></section>
      ${f.noComposer ? '<textarea placeholder="Search" id="internal-decoy"></textarea>' : f.lexical ? `<div data-pagelet="IGDComposerForCannes">${lexical}</div>` : f.textarea ? '<textarea placeholder="Повідомлення..."></textarea>' : '<div contenteditable="true" role="textbox" aria-label="Message"></div>'}`;
        if (f.lexical) main.setAttribute('role', 'main');
        let conversationHeader = main.querySelector('header');
        if (f.pageletHeader) {
          const pagelet = document.createElement('div');
          pagelet.dataset.pagelet = f.unknownPagelet
            ? 'UnknownHeader'
            : 'IGDInboxHeaderOffMsys';
          pagelet.innerHTML = `<div><div style="min-height: 44px"><div><a role="link" href="/${f.wrongRecipient ? 'other' : 'fixture_company'}/" aria-label="Open the profile page of fixture_company">Recipient</a></div></div></div>`;
          conversationHeader.replaceWith(pagelet);
          conversationHeader = pagelet;
          main.insertAdjacentHTML(
            'beforeend',
            '<div role="navigation" aria-label="Thread list"><a href="/sidebar_person/">Sidebar person</a></div>',
          );
          if (f.nestedSemanticHeader) {
            const header = document.createElement('header');
            header.append(...pagelet.childNodes);
            pagelet.append(header);
          }
          if (f.outerSemanticHeader) {
            const header = document.createElement('div');
            header.setAttribute('role', 'banner');
            pagelet.replaceWith(header);
            header.append(pagelet);
          }
        }
        if (f.lexicalDecoys) {
          conversationHeader.insertAdjacentHTML('beforeend', lexical);
          main.insertAdjacentHTML(
            'beforeend',
            `<div role="navigation">${lexical}</div><aside>${lexical}</aside>`,
          );
        }
        if (f.duplicateLexical) main.insertAdjacentHTML('beforeend', lexical);
        if (f.innerDialog || f.splitPane) {
          const active = document.createElement('div');
          active.setAttribute('role', 'dialog');
          if (f.splitPane) {
            active.innerHTML = '<header><strong>other_person</strong></header>';
            active.append(...Array.from(main.children).slice(1));
          } else active.append(...main.childNodes);
          main.append(active);
        }
        if (f.hiddenRecipient) {
          conversationHeader.querySelector('a').hidden = true;
          conversationHeader.insertAdjacentHTML(
            'beforeend',
            '<strong>other_person</strong>',
          );
        }
        if (f.staleHeader)
          main.insertAdjacentHTML(
            'afterbegin',
            '<header><strong>other_person</strong></header>',
          );
        if (f.ambiguousDialog)
          main.insertAdjacentHTML(
            'afterend',
            '<div role="dialog"><header><a href="/fixture_company/">Recipient</a></header><textarea placeholder="Message"></textarea></div>',
          );
        if (f.sidebarOnlyRecipient) {
          const sidebar = document.createElement('div');
          sidebar.setAttribute('role', 'navigation');
          sidebar.setAttribute('aria-label', 'Thread list');
          sidebar.append(conversationHeader.cloneNode(true));
          conversationHeader.innerHTML = '<span>Unconfirmed recipient</span>';
          main.append(sidebar);
        }
        if (f.groupRecipient)
          conversationHeader.insertAdjacentHTML(
            'beforeend',
            '<a href="/other/">Other recipient</a>',
          );
        if (f.mainOnlyRecipient)
          conversationHeader.replaceWith(...conversationHeader.childNodes);
        if (f.foreignNestedDialog)
          main.insertAdjacentHTML(
            'beforeend',
            '<div role="dialog"><header><a href="/other/">Other recipient</a></header><textarea placeholder="Message"></textarea></div>',
          );
        if (f.observedMessage) {
          const list = document.createElement('div');
          list.id = 'messages';
          list.dataset.pagelet = 'IGDMessagesList';
          main.querySelector('#messages').replaceWith(list);
          main.insertAdjacentHTML('beforeend', selfLink('fixture_company'));
          const sidebar = document.createElement('aside');
          sidebar.innerHTML = selfLink('sidebar_person');
          document.body.append(sidebar);
        }
        let messageIndex = 0;
        const appendMessage = (text, author = 'fixture_sender') => {
          const row = document.createElement('div');
          if (f.observedMessage) {
            // Confirmed article subtree from ROOT's 2026-11-14 inspection.
            row.style.opacity = '1';
            const id = `fixture-message-label-${messageIndex++}`;
            row.innerHTML = `<div><div role="group" tabindex="-1"></div><div><div><div><div aria-labelledby="${id}" aria-roledescription="message" role="article" tabindex="0"><div id="${id}" role="none"><div role="none"><div><div role="presentation"><span dir="auto"><div dir="auto"></div></span></div></div></div></div></div><div style="--x-width:96px"></div><div role="group" aria-label="Message actions" data-igd-message-actions-hidden="true"><div><span><div><div role="button" tabindex="0" aria-label="Reply to message from ${author}"><svg role="img" aria-label="Reply to message from ${author}"></svg></div></div></span></div></div></div></div></div></div>`;
            row.querySelector('span > div').textContent = text;
            if (f.noMessageActions)
              row.querySelector('[aria-label="Message actions"]').remove();
            if (f.neighborActions) {
              const neighbor = row.cloneNode(true);
              const neighborId = `fixture-message-label-${messageIndex++}`;
              neighbor.querySelector('[id]').id = neighborId;
              neighbor
                .querySelector('[role="article"]')
                .setAttribute('aria-labelledby', neighborId);
              neighbor.querySelector('[dir="auto"] > div').textContent =
                'Other body';
              row.querySelector('[aria-label="Message actions"]').remove();
              main.querySelector('#messages').append(neighbor);
            }
            if (f.multipleArticles)
              row
                .querySelector('[role="article"]')
                .after(row.querySelector('[role="article"]').cloneNode(true));
          } else {
            row.setAttribute('aria-label', 'You sent');
            const span = document.createElement('span');
            span.textContent = text;
            row.append(span);
          }
          main.querySelector('#messages').append(row);
          if (f.prependMessage) main.querySelector('#messages').prepend(row);
        };
        if (f.existingMessage)
          appendMessage(
            f.existingBody ?? 'Synthetic message',
            f.existingAuthor,
          );
        if (f.wrongRecipient)
          document.body.insertAdjacentHTML(
            'beforeend',
            '<aside><a href="/fixture_company/">Sidebar target</a></aside>',
          );
        if (f.duplicateComposer)
          main.insertAdjacentHTML(
            'beforeend',
            '<textarea placeholder="Message"></textarea>',
          );
        document.body.insertAdjacentHTML(
          'beforeend',
          '<textarea id="decoy" placeholder="Search"></textarea>',
        );
        const findComposer = () =>
          main.querySelector(
            '[data-pagelet="IGDComposerForCannes"] [contenteditable]',
          ) || main.querySelector('[contenteditable], textarea:not([id])');
        let composer = findComposer();
        const mutateDialog = (phase) => {
          if (phase === 'after_marker' && f.markerMessage)
            appendMessage('Synthetic message');
          if (f.mismatchPhase !== phase) return;
          if (f.headerMismatch)
            conversationHeader.insertAdjacentHTML(
              'beforeend',
              '<a href="/synthetic_private_recipient/">Synthetic private label</a><a href="/another_private_recipient/">Private label</a><a href="/direct/inbox/">Inbox</a><a hidden href="/hidden_private_recipient/">Hidden</a>',
            );
          if (f.replaceContainer) {
            const previous = main;
            main = main.cloneNode(true);
            if (f.preserveComposer) findComposer().replaceWith(composer);
            previous.replaceWith(main);
            conversationHeader = main.querySelector(
              ':is(header, [data-pagelet="IGDInboxHeaderOffMsys"])',
            );
            composer = findComposer();
            if (f.replacementCase === 'recipient')
              conversationHeader.querySelector('a').href = '/other/';
            if (f.replacementCase === 'sidebar') {
              const sidebar = document.createElement('aside');
              sidebar.append(conversationHeader.cloneNode(true));
              conversationHeader.innerHTML =
                '<span>Unconfirmed recipient</span>';
              main.append(sidebar);
            }
            if (f.replacementCase === 'dialogs')
              main.insertAdjacentHTML(
                'afterend',
                '<div role="dialog"><header><a href="/fixture_company/">Recipient</a></header><textarea placeholder="Message"></textarea></div>',
              );
            if (f.replacementCase === 'composers')
              composer.after(composer.cloneNode(true));
            if (f.replacementCase === 'foreign') {
              const foreign = document.createElement('div');
              foreign.setAttribute('role', 'dialog');
              foreign.innerHTML =
                '<header><a href="/other/">Other</a></header>';
              foreign.append(composer);
              main.append(foreign);
            }
            if (f.replacementCase === 'unrelated')
              document.body.append(composer);
            if (f.replacementCase === 'empty') composer.textContent = '';
            if (f.replacementCase === 'readonly')
              composer.setAttribute('aria-readonly', 'true');
            window.fixtureEvent('replace:container');
          }
          if (f.dialogUrlParts) {
            const url = new URL(location.href);
            if (f.dialogUrlParts.includes('path'))
              url.pathname = '/direct/t/synthetic-private-thread/';
            if (f.dialogUrlParts.includes('query'))
              url.search = '?synthetic_private_query=value';
            if (f.dialogUrlParts.includes('hash'))
              url.hash = '#synthetic-private-hash';
            history.replaceState({}, '', url);
          }
        };
        mutateDialog('initial');
        composer?.addEventListener('input', () => mutateDialog('after_fill'), {
          once: true,
        });
        document.addEventListener(
          'fixture-marker',
          () => mutateDialog('after_marker'),
          { once: true },
        );
        if (composer)
          document.addEventListener('keydown', (event) => {
            if (event.target !== composer || event.key !== 'Enter') return;
            event.preventDefault();
            window.fixtureEvent('send');
            if (f.postLogin) main.innerHTML = '<input type="password">';
            else if (!f.noConfirmation) {
              appendMessage(
                composer.value ?? composer.innerText,
                f.messageAuthor,
              );
            }
            if (f.cloneOldMessage) {
              const list = main.querySelector('#messages');
              list.replaceChildren(
                ...Array.from(list.childNodes).map((node) =>
                  node.cloneNode(true),
                ),
              );
            }
            if (f.rewriteOldBody)
              main.querySelector('#messages [dir="auto"] > div').textContent =
                'Synthetic message';
            if (f.switchSenderAfterSend)
              document.querySelector(
                '#fixture-rail a[href="/fixture_sender/"]',
              ).outerHTML = selfLink('another_sender');
            if (f.clearComposer) composer.textContent = '';
            mutateDialog('after_send');
          });
      };
      if (f.delayedDialog) setTimeout(open, 60);
      else open();
    };
    main.querySelector('button, a').onclick = openConversation;
    if (f.overflow) {
      // Screenshot-supported structure; accessible labels/roles are assumptions.
      // The profile has Follow only; the username's options open a body portal.
      const direct = main.querySelector('button, a');
      if (!f.directAvailable) direct.hidden = true;
      main
        .querySelector('header')
        .insertAdjacentHTML(
          'beforeend',
          '<button id="follow">Стежити</button><button id="options"><svg role="img" aria-label="Options"><title>Options</title></svg></button>',
        );
      let options = document.querySelector('#options');
      let capturedPopup;
      if (f.sanitizedMenu) {
        const template = document.createElement('template');
        template.innerHTML = f.sanitizedMarkup;
        const capturedHeader = template.content.querySelector('header');
        main.querySelector('header').replaceWith(capturedHeader);
        options = capturedHeader.querySelector('[role="button"]');
        capturedPopup = template.content.querySelector('[role="dialog"]');
      }
      options.setAttribute(
        'aria-haspopup',
        f.menuDialog || f.sanitizedMenu ? 'dialog' : 'menu',
      );
      options.setAttribute(
        'aria-expanded',
        f.alreadyExpanded ? 'true' : 'false',
      );
      if (f.controls) options.setAttribute('aria-controls', 'profile-popup');
      const follow = document.querySelector('#follow');
      if (follow) follow.onclick = () => window.fixtureEvent('unsafe:follow');
      if (f.unknownOptions) options.innerHTML = '…';
      if (f.wrongOptionsScope) document.body.append(options);
      if (f.duplicateOptions)
        options.insertAdjacentHTML('afterend', options.outerHTML);
      options.insertAdjacentHTML(
        'afterend',
        '<button hidden aria-label="Options">…</button>',
      );
      document.body.insertAdjacentHTML(
        'beforeend',
        `<aside><button>Options</button><button>Надіслати повідомлення</button></aside>
        <div role="menu" ${f.existingMenu || f.dangerousOverlay ? '' : 'hidden'}><button>Надіслати повідомлення</button></div>`,
      );
      document
        .querySelectorAll('aside button, [role="menu"] button')
        .forEach(
          (button) => (button.onclick = () => window.fixtureEvent('decoy')),
        );
      const existing = document.querySelector('[role="menu"]');
      const menuAncestor = document.createElement('div');
      existing.replaceWith(menuAncestor);
      menuAncestor.append(existing);
      if (f.harmlessMenu) existing.innerHTML = '<span>Navigation</span>';
      if (f.dangerousOverlay) {
        existing.setAttribute('role', 'dialog');
        existing.insertAdjacentHTML('beforeend', '<button>Cancel</button>');
        existing.querySelector('button:last-child').onclick = () =>
          window.fixtureEvent('unsafe:dismiss');
      }
      options.onclick = async () => {
        window.fixtureEvent('options');
        if (!f.noExpandedTransition)
          options.setAttribute('aria-expanded', 'true');
        const popup =
          capturedPopup ||
          (f.reuseHidden || f.reuseVisible
            ? existing
            : document.createElement('div'));
        popup.hidden = false;
        popup.id = f.wrongControls ? 'foreign-popup' : 'profile-popup';
        popup.setAttribute(
          'role',
          f.menuDialog || f.sanitizedMenu ? 'dialog' : 'menu',
        );
        if (f.wrongPopupRole) popup.setAttribute('role', 'dialog');
        if (!capturedPopup)
          popup.innerHTML = `<button>Заблокувати</button><button>Обмежити</button><button>Поскаржитися</button><button>Поширити в...</button><button>Про цей обліковий запис</button>`;
        popup
          .querySelectorAll('button')
          .forEach(
            (button) =>
              (button.onclick = () => window.fixtureEvent('unsafe:menu')),
          );
        const action = capturedPopup
          ? capturedPopup.querySelector('[role="button"]')
          : document.createElement(f.menuLink ? 'a' : 'button');
        if (f.menuLink) action.href = '#';
        if (f.menuItem) action.setAttribute('role', 'menuitem');
        if (!capturedPopup) action.textContent = 'Надіслати повідомлення';
        action.onclick = (event) => {
          popup.remove();
          openConversation(event);
        };
        if (f.interactionStyle)
          action.addEventListener(f.interactionStyle, () => {
            action.classList.add('interaction-style');
            action.style.color = 'red';
            // React may wrap the same label while applying interaction styling.
            action.innerHTML = '<span>Надіслати повідомлення</span>';
            existing.classList.add('background-style');
          });
        if (f.documentCaptureChange) {
          document.addEventListener(
            'click',
            (event) => {
              if (!event.composedPath().includes(action)) return;
              changeAction(f.documentCaptureChange);
              window.fixtureEvent('document-capture');
            },
            true,
          );
          action.onclick = (event) => {
            event.preventDefault();
            window.fixtureEvent('unsafe:click');
          };
        }
        function changeAction(change) {
          if (change === 'block') action.textContent = 'Заблокувати';
          if (change === 'label')
            action.setAttribute('aria-label', 'Заблокувати');
          if (change === 'move') existing.append(action);
          if (change === 'role') action.setAttribute('role', 'checkbox');
          if (change === 'popup') popup.id = 'foreign-popup';
          if (change === 'replace') action.replaceWith(action.cloneNode(true));
          if (change === 'disable') action.disabled = true;
          if (change === 'hide') action.style.visibility = 'hidden';
        }
        if (f.noMenuMessage || f.wrongMenu) action.hidden = true;
        if (!capturedPopup) popup.append(action);
        if (f.duplicateMenuAction)
          popup.insertAdjacentHTML('beforeend', action.outerHTML);
        if (f.menuRateLimit) await fetch('/api/v1/direct/fixture/');
        if (f.mutateExisting)
          existing.insertAdjacentHTML(
            'beforeend',
            '<button>Send message</button>',
          );
        document.body.append(popup);
        if (f.bodyScrollLock) document.body.style.overflow = 'hidden';
        if (f.menuAncestorAriaHidden)
          menuAncestor.setAttribute('aria-hidden', 'true');
        if (f.delayedActionChange) {
          action.disabled = true;
          if (f.delayedActionChange !== 'enable')
            action.onclick = (event) => {
              event.preventDefault();
              window.fixtureEvent(`unsafe:${f.delayedActionChange}`);
            };
          setTimeout(() => {
            changeAction(f.delayedActionChange);
            action.disabled = false;
          }, 150);
        }
        if (f.duplicateMenu)
          popup.insertAdjacentHTML('afterend', popup.outerHTML);
        if (f.menuProfileMismatch) history.replaceState({}, '', '/other/');
        if (f.menuRecipientMismatch)
          main.querySelector('h1, h2').textContent = 'other';
      };
    }
  }
</script>
