name: sonar-v2
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: sonar
      # Same layout as the existing server volume (data lives in the pgdata subfolder).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
    # Loopback only. Reached from outside via `tailscale serve` (server) or an SSH tunnel (dev).
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20
  backup:
    image: postgres:17-bookworm
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ../backups:/backups
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: [/bin/sh, -c]
    command:
      - 'while true; do /bin/sh /usr/local/bin/backup.sh || echo "Sonar backup failed" >&2; sleep 86400; done'
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: build }
    command: [pnpm, db:migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:?Set REGISTRY_DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  cli:
    profiles: [tools]
    build: { context: .., dockerfile: docker/Dockerfile, target: build }
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:?Set REGISTRY_DATABASE_URL}
    stdin_open: true
    tty: true
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-50}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 characters)}
      APP_URL: ${APP_URL:?Set APP_URL}
      SOCIAL_PROXY_URLS: ${SOCIAL_PROXY_URLS:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:?Set REGISTRY_DATABASE_URL}
    ports: ['127.0.0.1:58000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    volumes:
      # Free-space check only: same filesystem as the data, without the repo root (.env).
      - ./:/host-disk:ro
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 characters)}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEND_API_TOKEN: ${RESEND_API_TOKEN:-}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
      SOCIAL_PROXY_URLS: ${SOCIAL_PROXY_URLS:-}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-50}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:?Set REGISTRY_DATABASE_URL}
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
  waha:
    image: devlikeapro/waha:noweb-2026.10.1
    platform: linux/amd64
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: 'false'
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
    volumes:
      - waha:/app/.sessions
volumes:
  postgres:
    external: true
    name: sonar-server_postgres
  waha:
